name: Repository checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  baseline:
    name: Baseline files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify repository baseline
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s .env.example
          test -s CONTRIBUTING.md
          test -s SECURITY.md
